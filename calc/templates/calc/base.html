{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Enable responsiveness on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Ezzy Website{% endblock %}</title>

    <!-- Bootstrap 5 CSS from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Optional block for page-specific styles/scripts -->
    {% block head %}{% endblock %}
</head>

<body style="background-color: #e9ebee; font-family: Tahoma;">

    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Ezzy</a>

            <!-- Toggle button for mobile view -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar menu items (collapsible on small screens) -->
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="{% url 'register' %}" class="btn btn-success me-2">Register</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'login' %}" class="btn btn-light text-dark">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <!-- WhatsApp Floating Icon (middle left, animated) -->
    <a href="https://wa.me/255616590910" target="_blank" id="whatsapp-float" aria-label="Chat on WhatsApp">
        <img src="{% static 'calc/images/whatsapp.png' %}" alt="WhatsApp Icon">
    </a>

    <!-- Style for floating WhatsApp icon -->
    <style>
        #whatsapp-float {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 999;
            animation: bounce 1.2s infinite;
        }

        #whatsapp-float img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-50%) translateY(0); }
            50% { transform: translateY(-50%) translateY(-10px); }
        }
    </style>

    <!-- Bootstrap Bundle JS for responsive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
