<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ezzy Site{% endblock %}</title>

    <!-- Load static files -->
    {% load static %}

    <!-- Link to your custom CSS file -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        /* Your Custom Styles */
        #blue_bar {
            height: 50px;
            background-color: #405d9b;
            color: white;
            padding: 10px 0;
            font-size: 30px;
            text-align: center;
        }

        #signup_button {
            background-color: #42b72a;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 5px;
        }

        #signup_button:hover {
            background-color: #36a420;  /* Darker green on hover */
        }

    

        .navbar {
            padding: 15px 30px;
            background-color: #3c5a99;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .navbar a:hover {
            background-color: #2c4582; /* Darker shade on hover */
        }

        .container {
            margin-top: 40px;
        }
    </style>
</head>
<body style="background-color: #f8f9fa; font-family: Tahoma;">

    <!-- Top Blue Bar -->
    <div id="blue_bar">
        <div style="font-size: 24px;">Ezzy</div>
        <div id="signup_button">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" style="color: white; text-decoration: none;">Dashboard</a>
                <span> | </span>
                <a href="{% url 'logout' %}" style="color: white; text-decoration: none;">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" style="color: white; text-decoration: none;">Login</a>
                <span> | </span>
                <a href="{% url 'register' %}" style="color: white; text-decoration: none;">Register</a>
            {% endif %}
        </div>
    </div>

    <!-- Search Box -->
    <div style="padding: 10px; text-align: center;">
    </div>

    <!-- Main Content Block -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
