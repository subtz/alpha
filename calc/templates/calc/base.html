{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ezzy Website{% endblock %}</title>

    <style>
        /* Fixed Top bar styles */
        #top_bar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #3c5a99;
            height: 100px;
            color: #d9dfeb;
            font-size: 40px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        #top_bar .site-name {
            font-weight: bold;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        .top-button {
            background-color: #42b72a;
            padding: 6px 12px;
            font-size: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .top-button a {
            color: white;
            text-decoration: none;
            display: block;
        }

        /* WhatsApp Floating Icon */
        #whatsapp-float {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 999;
            animation: bounce 1.2s infinite;
        }

        #whatsapp-float img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-50%) translateY(0); }
            50% { transform: translateY(-50%) translateY(-10px); }
        }

        body {
            background-color: #e9ebee;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        .container {
            padding: 90px 20px 20px; /* Top padding adjusted for fixed header */
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

    <!-- Top bar -->
    <div id="top_bar">
        <div class="site-name">Ezzy Website</div>
        <div class="top-buttons">
            <div class="top-button">
                <a href="{% url 'login' %}">Login</a>
            </div>
            <div class="top-button">
                <a href="{% url 'register' %}">Register</a>
            </div>
            <div class="top-button" style="background-color: white;">
                <a href="{% url 'home' %}" style="color: #3c5a99;">Home</a>
            </div>
        </div>
    </div>

    <!-- WhatsApp Floating Icon -->
    <a href="https://wa.me/255616590910" target="_blank" id="whatsapp-float" aria-label="Chat on WhatsApp">
        <img src="{% static 'calc/images/whatsapp.png' %}" alt="WhatsApp Icon">
    </a>

    <!-- Page content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
