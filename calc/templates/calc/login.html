{% extends "base.html" %}

{% block head %}

<!-- Optional additional styles specific to this page -->
<style>
    body {
        background-color: #f8f9fa;
        font-family: Tahoma, sans-serif;
    }

    /* Login form container */
    #login_bar {
        background-color: white;
        max-width: 400px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    /* Header */
    #login_bar h2 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
    }

    /* Input fields */
    .input-field {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
    }

    .input-field:focus {
        outline: none;
        border-color: #405d9b;
    }

    /* Submit button styling */
    #submit_button {
        background-color: #42b72a;
        color: white;
        font-size: 18px;
        font-weight: bold;
        padding: 12px 0;
        width: 100%;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    #submit_button:hover {
        background-color: #36a420;
    }

    /* Centered text and link styling */
    .text-center {
        text-align: center;
        margin-top: 10px;
    }

    .text-center a {
        color: #405d9b;
        text-decoration: none;
    }

    .text-center a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<!-- Main login form -->
<div id="login_bar">
    <h2>Login to Ezzy Site</h2>
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <!-- Username field -->
        <input type="text" class="input-field" name="username" placeholder="Username" required>

        <!-- Password field -->
        <input type="password" class="input-field" name="password" placeholder="Password" required>

        <!-- Submit button -->
        <button type="submit" id="submit_button">Login</button>
    </form>

    <!-- Register link -->
    <div class="text-center">
        <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
</div>
{% endblock %}
