{% extends 'calc/base.html' %}
{% load static %}

{% block head %}
<!-- Page-specific CSS -->
<style>

    #search_box {
        height: 40px;
        background-color: white;
        color: black;
        width: 100%;
        max-width: 400px;
        border-radius: 8px;
        border: solid 1px #aaa;
        font-size: 16px;
        padding: 8px 12px;
        background-image: url("{% static 'calc/images/searchicon2.jpg' %}");
        background-repeat: no-repeat;
        background-position: right center;
        background-size: 20px;
        margin: auto;
        display: block;
    }

    #profile_pic, #profile_pic2 {
        border-radius: 50%;
        border: 2px solid white;
    }

    #profile_pic {
        height: 200px;
        width: 200px;
        margin-top: -100px;
    }

    #profile_pic2 {
        height: 150px;
        width: 150px;
    }

    #menu_buttons {
        display: inline-block;
        padding: 10px 15px;
        background-color: #f0f0f0;
        border-radius: 20px;
        margin: 5px;
        font-weight: bold;
        color: #405d9b;
    }

    .nav-button {
        display: inline-block;
        padding: 12px 20px;
        background-color: #42b72a;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        margin: 5px;
        font-weight: bold;
        transition: background-color 0.3s;
    }

    .nav-button:hover {
        background-color: #359a20;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<!-- Profile Header with Title -->
<div class="container">
  
    <!-- Search bar -->
    <input type="text" id="search_box" placeholder="Search">

    <!-- Right-floating image -->
    <img src="{% static 'calc/images/mmil.jpg' %}" alt="Profile Icon" style="width: 100px; float: right; margin-top: -60px;">

    <!-- Profile Content -->
    <div class="mx-auto" style="max-width: 800px;">
        <div class="text-center bg-white p-3 shadow-sm rounded">

            <!-- Cover Image -->
            <img src="{% static 'calc/images/house.jpg' %}" class="img-fluid mb-3" style="height: 300px; object-fit: cover; width: 100%;" alt="Cover">

            <!-- Main Profile Picture -->
            <img src="{% static 'calc/images/OIF.jpg' %}" id="profile_pic" class="mb-3" alt="Main Profile">

            <!-- Secondary Profile Picture -->
            <img src="{% static 'calc/images/ezzy.png' %}" id="profile_pic2" class="mb-3" alt="Secondary Profile">

            <!-- Profile Info -->
            <div style="font-size: 20px;">EZRA BONPHASE</div>

            <!-- Menu Buttons -->
            <div class="mt-3">
                <span id="menu_buttons">Timeline</span>
                <span id="menu_buttons">Friends</span>
                <span id="menu_buttons">Photos</span>
                <span id="menu_buttons">About</span>
                <span id="menu_buttons">Settings</span>
            </div>

            <!-- Smart Queue Navigation Buttons -->
            <div class="mt-4">
                <a href="{% url 'queue_list' %}" class="nav-button">View Queues</a>
                <a href="/admin/" class="nav-button">Admin Panel</a>
            </div>
        </div>
    </div>

    <!-- Placeholder for additional sections -->
    <div class="row mt-5">
        <div class="col-md-4" style="min-height: 400px;"></div>
        <div class="col-md-8" style="min-height: 400px;"></div>
    </div>
</div>
{% endblock %}
