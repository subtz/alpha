{% extends 'calc/base.html' %}

{% block title %}Smart Queue - Available Queues{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<style>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Smart Queue</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/queues">Queues</a></li>
        <li class="nav-item"><a class="nav-link" href="/staff/dashboard">Staff Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
    <h1>Available Service Queues</h1>
    
    {% if queues %}
        <div class="queue-list">
            {% for queue in queues %}
                <div class="queue-card">
                    <h2>{{ queue.name }}</h2>
                    <p>{{ queue.description }}</p>
                    <p><strong>Current Capacity:</strong> 
                        {% with queue.queueentry_set.filter|length as count %}
                            {{ count }} / {{ queue.max_capacity }}
                        {% endwith %}
                    </p>
                    <a href="{% url 'join_queue' queue.id %}" class="btn btn-primary">Join Queue</a>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p>No active queues available at the moment. Please try again later.</p>
    {% endif %}
    
    <div class="navigation-buttons">
        <a href="{% url 'home' %}" class="nav-button">Home</a>
    </div>
</div>

<style>
    .queue-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin: 15px 0;
        background-color: #f9f9f9;
    }
    
    .queue-card h2 {
        margin-top: 0;
        color: #3c5a99;
    }
    
    .btn-primary {
        background-color: #42b72a;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
        display: inline-block;
    }
    
    .btn-primary:hover {
        background-color: #359a20;
    }

    .nav-button {
        display: inline-block;
        padding: 12px 20px;
        background-color: #3c5a99;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        margin: 10px;
        font-weight: bold;
        transition: background-color 0.3s;
    }

    .nav-button:hover {
        background-color: #2c3f6f;
        color: white;
    }
</style>
{% endblock %}
