{% extends 'calc/base.html' %}

{% block title %}Queue Entry Confirmed{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<style>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Smart Queue</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/queues">Queues</a></li>
        <li class="nav-item"><a class="nav-link" href="/staff/dashboard">Staff Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
    <div class="success-message">
        <h1>✓ Successfully Joined Queue!</h1>
        
        <div class="queue-details">
            <p><strong>Queue:</strong> {{ queue.name }}</p>
            <p><strong>Name:</strong> {{ customer.name }}</p>
            <p><strong>Phone:</strong> {{ customer.phone }}</p>
            <p><strong>Service:</strong> {{ service.name }}</p>
            <p><strong>Estimated Time:</strong> {{ service.estimated_time }} minutes</p>
        </div>
        
        <div class="queue-position">
            <h2>Your Position: {{ queue_entry.position }}</h2>
            <p>You are currently waiting in the queue.</p>
        </div>
        
        <div class="action-buttons">
            <a href="{% url 'queue_list' %}" class="btn btn-primary">View Other Queues</a>
            <a href="{% url 'home' %}" class="nav-button">Home</a>
        </div>
    </div>
</div>

<style>
    .success-message {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        border: 2px solid #42b72a;
        border-radius: 8px;
        background-color: #f0f9ed;
        text-align: center;
    }
    
    .success-message h1 {
        color: #42b72a;
        margin-top: 0;
    }
    
    .queue-details {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 20px;
        margin: 20px 0;
        text-align: left;
    }
    
    .queue-details p {
        margin: 10px 0;
        font-size: 16px;
    }
    
    .queue-position {
        background-color: #e8f5e9;
        border-left: 4px solid #42b72a;
        padding: 20px;
        margin: 20px 0;
        border-radius: 5px;
    }
    
    .queue-position h2 {
        margin-top: 0;
        color: #3c5a99;
    }
    
    .action-buttons {
        margin-top: 30px;
    }
    
    .btn-primary {
        background-color: #42b72a;
        color: white;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 5px;
        display: inline-block;
        margin: 0 10px;
    }
    
    .btn-primary:hover {
        background-color: #359a20;
    }
    
    .btn-secondary {
        background-color: #3c5a99;
        color: white;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 5px;
        display: inline-block;
        margin: 0 10px;
    }
    
    .btn-secondary:hover {
        background-color: #2c3f6f;
    }

    .nav-button {
        display: inline-block;
        padding: 12px 20px;
        background-color: #3c5a99;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-left: 10px;
        font-weight: bold;
        transition: background-color 0.3s;
    }

    .nav-button:hover {
        background-color: #2c3f6f;
        color: white;
    }
</style>
{% endblock %}
