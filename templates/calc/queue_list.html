<!DOCTYPE html>
<html>
<head>
    <title>Queues</title>
</head>
<body>

<h1>Available Queues</h1>

{% for queue in queues %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <h3>{{ queue.name }}</h3>
        <p>{{ queue.description }}</p>

        <p>Status:
            {% if queue.is_paused %}
                <b>Paused</b>
            {% else %}
                <b>Active</b>
            {% endif %}
        </p>

        <a href="{% url 'join_queue' queue.id %}">
            Join Queue
        </a>
    </div>
{% empty %}
    <p>No queues available.</p>
{% endfor %}

</body>
</html>
