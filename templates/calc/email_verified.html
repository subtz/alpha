{% extends 'calc/base.html' %}

{% block content %}
  <h2>Email Verified</h2>

  <!-- Show Django messages (e.g. success notices) -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <p>Your email has been verified successfully.</p>

  <!-- Navigation options -->
  <p>You can now <a href="{% url 'login' %}">log in</a> or go to your <a href="{% url 'dashboard' %}">Dashboard</a>.</p>
{% endblock %}
