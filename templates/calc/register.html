{% extends 'calc/base.html' %}

{% block head %}
<style>
    /* Base styles */
    body {
        background-color: #f8f9fa;
        font-family: Tahoma, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* Styling for signup button */
    #signup_button {
        background-color: #42b72a;
        width: 70px;
        text-align: center;
        padding: 4px;
        font-size: 20px;
        border-radius: 8px;
        float: right;
    }

    /* Login form container */
    #login_bar {
        background-color: white;
        width: 90%;
        max-width: 800px;
        border-radius: 8px;
        margin: auto;
        margin-top: 50px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    /* Input field styles */
    #text {
        width: 100%;
        max-width: 300px;
        border-radius: 8px;
        margin: auto;
        padding: 4px;
        border: solid 1px #aaa;
        font-size: 14px;
        margin-bottom: 15px;
    }

    /* Submit button styling */
    #submit {
        background-color: #3c5a99;
        width: 100%;
        max-width: 200px;
        border-radius: 8px;
        padding: 8px;
        color: white;
        font-weight: bold;
        margin-top: 15px;
        border: none;
        cursor: pointer;
    }

    /* Responsive design tweaks */
    @media (max-width: 768px) {

        #login_bar {
            width: 95%;
            padding: 15px;
        }

        #text {
            width: 80%;
            font-size: 12px;
        }

        #submit {
            width: 100%;
            font-size: 14px;
        }
    }

    /* Small screen adjustments */
    @media (max-width: 480px) {

        #text {
            width: 90%;
        }

        #submit {
            width: 100%;
            font-size: 16px;
        }
    }

    .error-message {
        color: red;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<div id="login_bar">

    <h2>Student Registration</h2>

    {% if form.errors %}
        <div class="error-message">
            Please correct the errors below.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <!-- Registration Number -->
        <input
            type="text"
            id="text"
            name="registration_number"
            placeholder="Registration Number"
            required
        ><br><br>

        <!-- Username -->
        <input
            type="text"
            id="text"
            name="username"
            placeholder="Input Username"
            required
        ><br><br>

        <!-- Email -->
        <input
            type="email"
            id="text"
            name="email"
            placeholder="Email Address"
            required
        ><br><br>

        <!-- Password -->
        <input
            type="password"
            id="text"
            name="password1"
            placeholder="Input Password"
            required
        ><br><br>

        <!-- Confirm Password -->
        <input
            type="password"
            id="text"
            name="password2"
            placeholder="Re-enter Password"
            required
        ><br><br>

        <!-- Submit Button -->
        <input
            type="submit"
            id="submit"
            value="Register"
        ><br>

    </form>
</div>
{% endblock %}
