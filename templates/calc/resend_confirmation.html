{% extends 'calc/base.html' %}

{% block content %}
<div class="container py-5">
    <h2>Resend Confirmation Email</h2>

    <!-- Show Django messages (e.g. resend success, errors) -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'resend_confirmation' %}">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required class="form-control mb-3">
        <button type="submit" class="btn btn-primary">Resend</button>
    </form>

    <p class="mt-3">
        Already verified? <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
